slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    max_laser_range: 8.0
    minimum_time_interval: 0.1
    resolution: 0.05
    
    transform_timeout: 0.3
    tf_buffer_duration: 30.
    
    minimum_travel_distance: 0.1 
    minimum_travel_heading: 0.1