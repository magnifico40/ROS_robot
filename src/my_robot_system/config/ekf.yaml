ekf_local:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom_wheels
    # KOŁA: Ufamy TYLKO prędkości (X, obrót Yaw). Zwróć uwagę na 'true' tylko w dolnych rzędach!
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu/data_raw
    # IMU: Ufamy orientacji Yaw i prędkości obrotu. (W trybie 2D roll i pitch są ignorowane)
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false,  false,  false]
    imu0_differential: false
    imu0_queue_size: 10

ekf_global:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /odom_wheels
    # KOŁA: Identycznie jak wyżej, tylko prędkości
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    imu0: /imu/data_raw
    # IMU: Identycznie jak wyżej
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false,  false,  false]
    imu0_differential: false

    # RTK GPS: Złote źródło pozycji absolutnej (tylko X i Y)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, fal5 se, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10

navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    magnetic_declination_radians: 0.1117 # Gdynia/Władysławowo ~6.4 stopnia na wschód
    # UWAGA: Jeśli przy jeździe na wprost robot na mapie jedzie bokiem, zmień to na 1.5707963
    yaw_offset: 0.0 
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: true